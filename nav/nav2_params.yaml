# Настройки Nav2 для T5
# Карты заранее нет: глобальная карта стоимости строится по лидару прямо во время движения.
# Робот - Go1 (CHAMP, команды /cmd_vel), базовый фрейм trunk, проходы 1 м.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: trunk
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml (наше дерево nav/navigate.xml) задается в t5.launch.py

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2          # Judge: 0.5 м
      yaw_goal_tolerance: 0.2         # Judge: 30° = 0.52 рад
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.08
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0   # = cost_scaling_factor локальной карты
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 2.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: true             # трасса неизвестна: через неисследованные клетки планировать можно

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # наше дерево navigate.xml использует wait и backup;
    # spin нужен стандартному дереву NavigateThroughPoses (иначе bt_navigator не запустится)
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: trunk
    transform_tolerance: 0.3

# Робот: корпус 0.38 м, ноги выступают в стороны, голова с камерой впереди
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: trunk
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[[0.26, 0.16], [0.26, -0.16], [-0.25, -0.16], [-0.25, 0.16]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # точки скана уже в системе odom и без пола (их публикует odom_node.py в /scan_cloud).
        # Так фильтру сообщений не нужно ждать TF - в tf2 Humble это ожидание может намертво
        # заблокировать карту (взаимная блокировка в MessageFilter).
        observation_sources: cloud
        cloud:
          topic: /scan_cloud
          data_type: "PointCloud2"
          min_obstacle_height: -1.0
          max_obstacle_height: 1.0
          sensor_frame: base_scan        # откуда шли лучи - для очистки карты вдоль луча
          clearing: true
          marking: true
          obstacle_max_range: 6.5
          raytrace_max_range: 6.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: trunk
      rolling_window: false
      track_unknown_space: true
      width: 80
      height: 80
      origin_x: -40.0
      origin_y: -40.0
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[[0.26, 0.16], [0.26, -0.16], [-0.25, -0.16], [-0.25, 0.16]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # точки скана уже в системе odom и без пола (их публикует odom_node.py в /scan_cloud).
        # Так фильтру сообщений не нужно ждать TF - в tf2 Humble это ожидание может намертво
        # заблокировать карту (взаимная блокировка в MessageFilter).
        observation_sources: cloud
        cloud:
          topic: /scan_cloud
          data_type: "PointCloud2"
          min_obstacle_height: -1.0
          max_obstacle_height: 1.0
          sensor_frame: base_scan        # откуда шли лучи - для очистки карты вдоль луча
          clearing: true
          marking: true
          obstacle_max_range: 6.5
          raytrace_max_range: 6.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      always_send_full_costmap: false     # карта большая: рассылаем только изменения
